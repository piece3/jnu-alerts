name: 공지 수집 + 배포

on:
  schedule:
    # 한국시간 07:52, 17:52 (UTC 기준으로 적음. 예약 실행은 몇 분~몇십 분 늦게 돌 수 있음)
    - cron: "52 22 * * *"
    - cron: "52 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data.json", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  TZ: Asia/Seoul   # D-day·NEW 계산과 수집 시각을 한국 날짜 기준으로

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 수집
        run: python scrape.py

      - name: data.json 커밋 (first_seen 유지)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: $(date '+%Y-%m-%d %H:%M') 수집"
          git push || (git pull --rebase && git push)

      - name: 사이트 구성
        run: |
          mkdir _site
          cp dashboard.html _site/index.html
          cp manifest.webmanifest sw.js _site/
          cp -r icons _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
