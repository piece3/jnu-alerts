<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전컴 공지 모아보기</title>
<meta name="description" content="전남대 전자컴퓨터공학부·사업단 공지와 공모전을 소스별로 모은 개인 대시보드.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#ffffff" id="themeColor">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
  // 기본은 흰 배경. 다크는 직접 켰을 때만(기기별로 기억).
  try { if (localStorage.getItem("theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
</script>
<style>
  :root{
    --bg:#ffffff; --side:#f5f8fe; --hover:#eef3fd;
    --ink:#0e1a2b; --ink-soft:#44526a; --ink-faint:#68768c; --line:#e1e7f0;
    --blue:#1b54d9; --blue-ink:#1443b3; --blue-soft:#e8efff; --on-blue:#ffffff;
    --crit:#c4302b; --crit-soft:#fdecea; --warn:#8f5600;
    --side-w:268px;
    --font:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  :root[data-theme="dark"]{
    --bg:#0d131d; --side:#121a27; --hover:#1a2434;
    --ink:#e8edf5; --ink-soft:#b3bfd0; --ink-faint:#8894a8; --line:#263245;
    --blue:#6f9bff; --blue-ink:#9dbbff; --blue-soft:#18284a; --on-blue:#0b1220;
    --crit:#ff8a84; --crit-soft:#3a1c1c; --warn:#e2a657;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;
    line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  h1,h2,p{margin:0}
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
  .num{font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ── 틀 ── */
  .layout{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
  .side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);
    border-right:1px solid var(--line);padding:22px 14px 18px;display:flex;flex-direction:column;gap:22px}
  .main{padding:34px 44px 80px;min-width:0}
  .main-in{max-width:860px}

  /* ── 사이드바 ── */
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px}
  .mark{width:30px;height:30px;flex:none;border-radius:8px;background:var(--blue);color:var(--on-blue);
    display:grid;place-items:center;font-weight:800;font-size:15px}
  .brand b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
  .brand span span{display:block;font-size:12px;color:var(--ink-faint)}
  .nav h2{font-size:12px;font-weight:600;color:var(--ink-faint);padding:0 10px;margin-bottom:5px}
  .nav ul{list-style:none;margin:0;padding:0;display:grid;gap:1px}
  .nav button,.nav a{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;
    padding:7px 10px;border-radius:8px;font-size:14px;color:var(--ink-soft);line-height:1.4}
  .nav button:hover,.nav a:hover{background:var(--hover);color:var(--ink)}
  .nav button[aria-current="true"]{background:var(--blue-soft);color:var(--blue-ink);font-weight:650}
  .nav .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav .ct{font-size:12.5px;color:var(--ink-faint);font-weight:500}
  .nav button[aria-current="true"] .ct{color:var(--blue-ink)}
  .nav .nw{font-size:11.5px;font-weight:700;color:var(--blue)}
  .nav .st{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
  .side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-faint)}
  .side-foot b{color:var(--ink-soft);font-weight:600}
  .side-foot .old{color:var(--warn)}
  .side-foot .btns{display:flex;gap:6px;margin-top:10px}
  .side-foot button{flex:1;font-size:13px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink-soft)}
  .side-foot button.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:600}
  .side-foot button:hover{border-color:var(--blue)}

  /* ── 본문 머리 ── */
  .mobilebar{display:none}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .head h1{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.25}
  .head p{font-size:14px;color:var(--ink-faint)}
  .head p b{color:var(--blue-ink);font-weight:650}

  /* ── 마감 임박 ── */
  .due{background:var(--blue-soft);border-radius:14px;padding:16px 18px 8px;margin-bottom:34px}
  .due h2{font-size:14px;font-weight:700;color:var(--blue-ink);margin-bottom:6px}
  .due-row{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:12px;align-items:center;
    padding:9px 0;border-top:1px solid color-mix(in srgb,var(--blue) 14%,transparent)}
  .due-row:first-of-type{border-top:0}
  .dd{justify-self:start;white-space:nowrap;font-size:13px;font-weight:750;padding:2px 9px;border-radius:999px;
    background:var(--bg);color:var(--blue-ink)}
  .dd.crit{background:var(--crit);color:#fff}
  :root[data-theme="dark"] .dd.crit{color:#1b0b0a}
  .due-t{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .due-row:hover .due-t{color:var(--blue-ink);text-decoration:underline;text-underline-offset:3px}
  .due-s{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
  .due-more{display:block;width:100%;border:0;background:none;padding:9px 0 8px;font-size:13px;font-weight:600;
    color:var(--blue-ink);text-align:left;border-top:1px solid color-mix(in srgb,var(--blue) 14%,transparent)}
  .due-more:hover{text-decoration:underline}

  /* ── 게시판 구역 ── */
  .group-label{font-size:13px;font-weight:600;color:var(--ink-faint);margin:0 0 14px}
  .group-label + .board{margin-top:0}
  .group-label.ext{margin-top:44px;padding-top:26px;border-top:1px solid var(--line)}
  .board{margin-bottom:34px}
  .board-h{display:flex;align-items:baseline;gap:10px;padding-bottom:9px;border-bottom:2px solid var(--ink)}
  .board-h h2{font-size:17.5px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
  .board-h h2.sort{font-size:13px;font-weight:600;color:var(--ink-faint);letter-spacing:0}
  .board-h .meta{font-size:13px;color:var(--ink-faint);white-space:nowrap}
  .board-h .meta b{color:var(--blue);font-weight:700}
  .board-h a{font-size:13px;color:var(--blue-ink);font-weight:550;white-space:nowrap}
  .board-h a:hover{text-decoration:underline;text-underline-offset:3px}
  .board-err{font-size:13px;color:var(--warn);padding:8px 0;border-bottom:1px solid var(--line)}
  .row{display:flex;gap:14px;align-items:baseline;padding:11px 4px;border-bottom:1px solid var(--line)}
  .row:hover{background:var(--hover)}
  .row-main{flex:1;min-width:0}
  .row-title{font-weight:500}
  .row:hover .row-title{color:var(--blue-ink)}
  .row:visited .row-title{color:var(--ink-faint)}
  .row-org{display:block;font-size:12.5px;color:var(--ink-faint);margin-top:1px}
  .row-meta{flex:none;font-size:13px;color:var(--ink-faint);white-space:nowrap}
  .row-meta.crit{color:var(--crit);font-weight:650}
  .row-meta.soon{color:var(--blue-ink);font-weight:650}
  .tag{display:inline-block;font-size:11px;font-weight:700;line-height:1;padding:3px 6px;border-radius:5px;
    margin-right:7px;vertical-align:2px}
  .tag.new{background:var(--blue);color:var(--on-blue)}
  .tag.pin{background:none;border:1px solid var(--line);color:var(--ink-faint);font-weight:600}
  .tag.hack{background:var(--blue-soft);color:var(--blue-ink)}
  .more{display:block;width:100%;border:0;background:none;text-align:left;padding:11px 4px;
    font-size:13.5px;font-weight:600;color:var(--blue-ink)}
  .more:hover{background:var(--hover)}
  .empty{padding:28px 0;color:var(--ink-faint);font-size:14.5px}
  .empty button{border:0;background:none;padding:0;color:var(--blue-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

  .foot{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-faint);line-height:1.75}
  .foot b{color:var(--ink-soft);font-weight:600}
  .foot .bad{color:var(--warn)}

  /* ── 좁은 화면: 사이드바는 서랍 ── */
  .scrim{display:none}
  @media (max-width:900px){
    .layout{display:block}
    .mobilebar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;background:var(--bg);
      border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
    .mobilebar button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 12px;
      font-size:14px;font-weight:600;color:var(--ink-soft)}
    .mobilebar b{font-size:15.5px;font-weight:700}
    .mobilebar .sp{flex:1}
    .side{position:fixed;inset:0 auto 0 0;z-index:20;width:min(86vw,300px);height:100dvh;
      padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(18px + env(safe-area-inset-bottom));
      transform:translateX(-102%);transition:transform .2s ease;box-shadow:none}
    .side.open{transform:none;box-shadow:0 0 40px rgba(14,26,43,.25)}
    .scrim{display:block;position:fixed;inset:0;z-index:15;background:rgba(14,26,43,.38);
      opacity:0;pointer-events:none;transition:opacity .2s ease}
    .scrim.open{opacity:1;pointer-events:auto}
    .nav button,.nav a{padding:10px 10px;font-size:15px}
    .main{padding:20px 16px calc(64px + env(safe-area-inset-bottom))}
    .head{margin-bottom:16px}
    .head h1{font-size:22px}
    .due{padding:14px 14px 6px;margin-bottom:28px;border-radius:12px}
    .due-row{grid-template-columns:66px minmax(0,1fr);row-gap:1px}
    .due-t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .due-s{grid-column:2}
    .row{padding:13px 2px;gap:10px}
    .board-h h2{font-size:16.5px}
  }
</style>

<div class="layout">
  <aside class="side" id="side" aria-label="분류와 게시판">
    <div class="brand">
      <span class="mark" aria-hidden="true">전</span>
      <span><b>전컴 공지 모아보기</b><span>전남대 전자컴퓨터공학부</span></span>
    </div>
    <nav class="nav" aria-label="분류"><h2>분류</h2><ul id="navCat"></ul></nav>
    <nav class="nav" aria-label="학교·사업단 게시판"><h2>학교 · 사업단</h2><ul id="navJnu"></ul></nav>
    <nav class="nav" aria-label="외부 공모전"><h2>외부 공모전 · 해커톤</h2><ul id="navExt"></ul></nav>
    <div class="side-foot">
      <div>마지막 수집 <b class="num" id="genAt">—</b></div>
      <div id="sched"></div>
      <div class="btns">
        <button type="button" class="primary" id="reload">새로고침</button>
        <button type="button" id="theme">어둡게</button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div>
    <div class="mobilebar">
      <button type="button" id="menu" aria-controls="side" aria-expanded="false">메뉴</button>
      <b>전컴 공지</b><span class="sp"></span>
      <button type="button" id="reload2">새로고침</button>
    </div>
    <main class="main"><div class="main-in">
      <header class="head"><h1 id="viewTitle">전체 게시판</h1><p id="viewCount"></p></header>
      <section class="due" id="due" hidden></section>
      <div id="boards"></div>
      <footer class="foot" id="foot"></footer>
    </div></main>
  </div>
</div>

<script>
/*__DATA__*/
(function () {
  var DATA = window.DASH_DATA;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };

  if (!DATA) {
    $("#boards").innerHTML = '<p class="empty">데이터가 없습니다. <code>python scrape.py</code>로 만든 <b>dashboard.html</b>을 여세요.</p>';
    return;
  }

  var CATS = [["all","전체"],["notice","공지"],["contest","공모전·대회"],["hack","해커톤"],["academic","학사·장학"],["job","채용·인턴"]];
  var PREVIEW = 6, DUE_PREVIEW = 5;
  var cat = "all", src = "all", expanded = {}, dueOpen = false;

  var today = new Date(); today.setHours(0,0,0,0);
  var dday = function (iso) {
    if (!iso) return null;
    var p = iso.split("-");
    var d = new Date(+p[0], +p[1]-1, +p[2]); d.setHours(0,0,0,0);
    return Math.round((d - today) / 86400000);
  };
  var ddayText = function (n) { return n < 0 ? "마감" : n === 0 ? "D-DAY" : "D-" + n; };
  var mdk = function (iso) { var p = iso.split("-"); return (+p[1]) + "/" + (+p[2]); };
  var shortDate = function (iso) {
    var p = (iso || "").split("-");
    if (p.length !== 3) return iso || "—";
    return (+p[0] === today.getFullYear() ? "" : p[0].slice(2) + ".") + p[1] + "." + p[2];
  };

  var passCat = function (it, c) { return c === "all" || (c === "hack" ? it.hack : it.category === c); };
  var bySrc = function (s) { return src === "all" || s.key === src; };
  var real = DATA.sources.filter(function (s) { return !s.linkonly; });

  // ── 사이드바 ──
  function navBtn(kind, key, name, count, extra) {
    var on = (kind === "cat" ? cat : src) === key;
    return '<li><button type="button" data-' + kind + '="' + esc(key) + '"' + (on ? ' aria-current="true"' : '') + '>'
      + '<span class="nm">' + esc(name) + '</span>' + (extra || '')
      + '<span class="ct num">' + count + '</span></button></li>';
  }
  function renderNav() {
    $("#navCat").innerHTML = CATS.map(function (c) {
      var n = 0;
      real.filter(bySrc).forEach(function (s) { n += s.items.filter(function (it) { return passCat(it, c[0]); }).length; });
      return navBtn("cat", c[0], c[1], n);
    }).join("");
    var total = 0, jnu = [], ext = [];
    DATA.sources.forEach(function (s) {
      if (s.linkonly) {
        jnu.push('<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener" title="자동 수집을 지원하지 않는 사이트라 새 탭으로 엽니다">'
          + '<span class="nm">' + esc(s.name) + '</span><span class="ct">사이트 열기</span></a></li>');
        return;
      }
      var items = s.items.filter(function (it) { return passCat(it, cat); });
      var nnew = items.filter(function (i) { return i.is_new; }).length;
      total += items.length;
      (s.group === "ext" ? ext : jnu).push(navBtn("src", s.key, s.name, items.length,
        (s.stale ? '<span class="st" title="수집 실패 — 직전 데이터 표시 중"></span>' : '')
        + (nnew ? '<span class="nw num">+' + nnew + '</span>' : '')));
    });
    $("#navJnu").innerHTML = navBtn("src", "all", "전체 게시판", total) + jnu.join("");
    $("#navExt").innerHTML = ext.join("");
  }

  // ── 마감 임박 ──
  function renderDue() {
    var all = [];
    real.filter(bySrc).forEach(function (s) {
      s.items.forEach(function (it) {
        if (!it.deadline || !passCat(it, cat)) return;
        var n = dday(it.deadline);
        if (n === null || n < 0 || n > 30) return;
        all.push({ n:n, it:it, s:s });
      });
    });
    var el = $("#due");
    if (!all.length) { el.hidden = true; el.innerHTML = ""; return; }
    all.sort(function (a, b) { return a.n - b.n; });
    var list = dueOpen ? all : all.slice(0, DUE_PREVIEW);
    el.hidden = false;
    el.innerHTML = '<h2>마감 임박 <span class="num">' + all.length + '</span>건</h2>'
      + list.map(function (x) {
        return '<a class="due-row" href="' + esc(x.it.url) + '" target="_blank" rel="noopener">'
          + '<span class="dd num' + (x.n <= 7 ? " crit" : "") + '">' + ddayText(x.n) + '</span>'
          + '<span class="due-t">' + esc(x.it.title) + '</span>'
          + '<span class="due-s num">' + esc(x.s.name) + ' · ' + mdk(x.it.deadline) + '까지</span></a>';
      }).join("")
      + (all.length > DUE_PREVIEW
          ? '<button type="button" class="due-more" id="dueMore">' + (dueOpen ? "접기" : "나머지 " + (all.length - DUE_PREVIEW) + "건 보기") + '</button>'
          : '');
  }

  // ── 게시판 목록 ──
  function rowHtml(it, isExt, showPins) {
    var n = dday(it.deadline), right, cls = "";
    if (n !== null && n >= -1) {
      right = ddayText(n) + " · " + mdk(it.deadline);
      cls = n < 0 ? "" : n <= 7 ? " crit" : n <= 14 ? " soon" : "";
    } else { right = shortDate(it.date); }
    return '<a class="row" href="' + esc(it.url) + '" target="_blank" rel="noopener">'
      + '<span class="row-main"><span class="row-title">'
      + (it.is_new ? '<span class="tag new">NEW</span>' : '')
      + (it.pinned && showPins ? '<span class="tag pin">고정</span>' : '')
      + (it.hack ? '<span class="tag hack">해커톤</span>' : '')
      + esc(it.title) + '</span>'
      + (isExt && it.author ? '<span class="row-org">' + esc(it.author) + '</span>' : '')
      + '</span><span class="row-meta num' + cls + '">' + esc(right) + '</span></a>';
  }
  function renderBoards() {
    var shown = 0, newN = 0, html = [], lastGroup = null, single = src !== "all";
    real.filter(bySrc).forEach(function (s) {
      var isExt = s.group === "ext";
      var items = s.items.filter(function (it) { return passCat(it, cat); });
      if (!items.length && !single) return;
      shown += items.length;
      var nnew = items.filter(function (i) { return i.is_new; }).length;
      newN += nnew;
      if (!single && s.group !== lastGroup) {
        html.push('<p class="group-label' + (isExt ? " ext" : "") + '">'
          + (isExt ? "외부 공모전 · 해커톤 — 전자·컴퓨터 전공 키워드로 거른 것, 마감일순" : "학교 · 사업단 — 고정 공지 먼저, 그다음 최신순") + '</p>');
        lastGroup = s.group;
      }
      var pinnedN = items.filter(function (i) { return i.pinned; }).length;
      var showPins = pinnedN < items.length;      // 전부 고정공지면 표시 생략
      var open = single || expanded[s.key] || items.length <= PREVIEW + 1;
      var list = open ? items : items.slice(0, PREVIEW);
      // 게시판 하나만 볼 때는 이름·건수가 맨 위 제목에 이미 있으므로 정렬 기준만 적는다
      html.push('<section class="board"><div class="board-h">'
        + (single ? '<h2 class="sort">' + (isExt ? "마감일순" : "고정 공지 먼저, 그다음 최신순") + '</h2>'
                  : '<h2>' + esc(s.name) + '</h2><span class="meta num">' + (nnew ? '<b>새 글 ' + nnew + '</b> · ' : '') + items.length + '건</span>')
        + '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + (isExt ? "사이트 열기" : "게시판 열기") + '</a></div>'
        + (s.error ? '<p class="board-err">이번 수집에 실패해 직전 데이터를 보여주고 있습니다. (' + esc(s.error) + ')</p>' : '')
        + (list.map(function (it) { return rowHtml(it, isExt, showPins); }).join("")
            || '<p class="empty">이 분류에 해당하는 글이 없습니다. <button type="button" data-reset="cat">전체 분류 보기</button></p>')
        + (open ? '' : '<button type="button" class="more" data-more="' + esc(s.key) + '">' + (items.length - PREVIEW) + '건 더 보기</button>')
        + '</section>');
    });
    $("#boards").innerHTML = html.join("")
      || '<p class="empty">이 분류에 해당하는 글이 없습니다. <button type="button" data-reset="cat">전체 분류 보기</button></p>';

    var cur = real.filter(function (s) { return s.key === src; })[0];
    var catName = CATS.filter(function (c) { return c[0] === cat; })[0][1];
    $("#viewTitle").textContent = (cur ? cur.name : "전체 게시판") + (cat === "all" ? "" : " — " + catName);
    $("#viewCount").innerHTML = '<span class="num">' + shown + '</span>건' + (newN ? ' · <b class="num">새 글 ' + newN + '건</b>' : '');
  }

  function render() { renderNav(); renderDue(); renderBoards(); }

  // ── 동작 ──
  var side = $("#side"), scrim = $("#scrim"), menu = $("#menu");
  function drawer(open) {
    side.classList.toggle("open", open); scrim.classList.toggle("open", open);
    menu.setAttribute("aria-expanded", open ? "true" : "false");
  }
  menu.addEventListener("click", function () { drawer(!side.classList.contains("open")); });
  scrim.addEventListener("click", function () { drawer(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") drawer(false); });

  side.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-cat],button[data-src]"); if (!b) return;
    if (b.dataset.cat) cat = b.dataset.cat; else src = b.dataset.src;
    dueOpen = false;
    render(); drawer(false);
    window.scrollTo(0, 0);
  });
  $(".main").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.more) { expanded[b.dataset.more] = true; renderBoards(); }
    else if (b.dataset.reset) { cat = "all"; render(); }
    else if (b.id === "dueMore") { dueOpen = !dueOpen; renderDue(); }
  });

  var reload = function () { location.reload(); };
  $("#reload").addEventListener("click", reload);
  $("#reload2").addEventListener("click", reload);

  var root = document.documentElement, themeBtn = $("#theme");
  function syncTheme() {
    var dark = root.getAttribute("data-theme") === "dark";
    themeBtn.textContent = dark ? "밝게" : "어둡게";
    $("#themeColor").setAttribute("content", dark ? "#0d131d" : "#ffffff");
  }
  themeBtn.addEventListener("click", function () {
    var dark = root.getAttribute("data-theme") !== "dark";
    if (dark) root.setAttribute("data-theme", "dark"); else root.removeAttribute("data-theme");
    try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
    syncTheme();
  });
  syncTheme();

  // ── 수집 시각 · 꼬리말 ──
  $("#genAt").textContent = DATA.generated_at || "—";
  $("#sched").textContent = DATA.schedule || "";
  // 자동 수집이 멈춘 걸 알아챌 수 있게, 수집한 지 36시간이 넘으면 강조
  var gen = new Date((DATA.generated_at || "").replace(" ", "T") + ":00+09:00");
  if (!isNaN(gen) && Date.now() - gen > 36 * 3600000) {
    $("#genAt").classList.add("old");
    $("#genAt").textContent += " (오래됨)";
  }
  var errs = DATA.sources.filter(function (s) { return s.error; });
  $("#foot").innerHTML =
    '<b>NEW</b>는 최근 4일 안에 처음 발견된 글, <b>고정</b>은 게시판 상단 고정 공지입니다. '
    + '제목에 <code>~9/18</code>, <code>9월 18일까지</code> 같은 표현이 있으면 마감일로 읽어 D-day를 계산합니다. '
    + '외부 공모전은 AI·SW·보안·데이터·로봇·반도체 같은 전공 키워드가 있는 것만 남깁니다.'
    + (errs.length ? '<br><span class="bad"><b>수집 실패:</b> ' + errs.map(function (s) { return esc(s.name); }).join(", ") + ' — 직전 데이터를 보여주고 있습니다.</span>' : '');

  render();
})();
// 설치형 웹앱: https 로 열렸을 때만 등록 (로컬 dashboard.html 더블클릭은 그대로 동작)
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js");
}
</script>
</html>
